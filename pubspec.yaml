name: expensemate
description: Offline personal finance and grocery tracker.
publish_to: 'none'
version: 1.6.4+24

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.68.0
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  pdf: ^3.11.1
  printing: ^5.13.1
  csv: ^6.0.0
  excel: ^4.0.6
  google_fonts: ^6.2.1
  crypto: ^3.0.5
  google_mlkit_text_recognition: ^0.13.0
  table_calendar: ^3.1.2
  package_info_plus: ^8.0.2
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  pointycastle: ^3.9.1
  asn1lib: ^1.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
